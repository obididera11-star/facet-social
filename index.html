
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Facet V2 - Real FB</title><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Helvetica,Arial,sans-serif}body{background:#f0f2f5}header{position:sticky;top:0;z-index:100;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:8px 16px;box-shadow:0 1px 2px rgba(0,0,0,.1)}.logo{color:#0866ff;font-size:28px;font-weight:900}.search-box{background:#f0f2f5;border-radius:20px;padding:8px 12px;display:flex;align-items:center;width:200px}.search-box input{border:none;background:transparent;outline:none;margin-left:8px;width:100%}.nav-center{display:flex;gap:8px}.nav-icon{width:90px;height:56px;display:flex;align-items:center;justify-content:center;border-radius:8px;cursor:pointer;color:#65676b;font-size:22px}.nav-icon.active{color:#0866ff;border-bottom:3px solid #0866ff}.container{display:flex;max-width:1920px;margin:0 auto}.left{width:260px;position:sticky;top:64px;height:calc(100vh - 64px);padding:16px 8px}.left-item{display:flex;align-items:center;gap:12px;padding:8px;border-radius:8px;cursor:pointer}.feed{flex:1;max-width:680px;margin:0 auto;padding:16px}.story-bar{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px}.story{min-width:110px;height:190px;border-radius:10px;position:relative;overflow:hidden;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.2)}.story img{width:100%;height:100%;object-fit:cover}.create-post{background:#fff;border-radius:8px;padding:12px 16px;box-shadow:0 1px 2px rgba(0,0,0,.1);margin:16px 0}.cp-top{display:flex;gap:8px;align-items:center}.cp-top img{width:40px;height:40px;border-radius:50%}.cp-top input{flex:1;background:#f0f2f5;border:none;border-radius:20px;padding:10px 12px;outline:none}.post{background:#fff;border-radius:8px;padding:12px 16px;margin-bottom:16px;box-shadow:0 1px 2px rgba(0,0,0,.1)}.pi{width:100%;border-radius:8px;max-height:500px;object-fit:cover;margin-top:8px}.ps{display:flex;justify-content:space-between;padding:8px 0;color:#65676b;font-size:14px;border-bottom:1px solid #e4e6eb}.pb{display:flex;justify-content:space-around;padding-top:8px}.btn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:8px;border-radius:8px;cursor:pointer;color:#65676b}.btn.liked{color:#0866ff}.hidden{display:none!important}.view{background:#fff;border-radius:8px;padding:16px;box-shadow:0 1px 2px rgba(0,0,0,.1)}.reel{position:relative;height:80vh;background:#000;border-radius:10px;overflow:hidden;margin-bottom:16px}.reel video{width:100%;height:100%;object-fit:cover}.ov{position:absolute;bottom:0;left:0;right:0;padding:16px;background:linear-gradient(transparent,rgba(0,0,0,.8));color:#fff}.ra{position:absolute;right:12px;bottom:80px;display:flex;flex-direction:column;gap:20px}.ra div{color:#fff;text-align:center}.market{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mitem{background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.1)}.mitem img{width:100%;height:160px;object-fit:cover}.minfo{padding:8px}.form input,.form textarea{width:100%;padding:12px;border:1px solid #dddfe2;border-radius:8px;margin:8px 0;outline:none}.btn-blue{background:#0866ff;color:#fff;border:none;padding:10px 16px;border-radius:8px;font-weight:600;cursor:pointer;width:100%}</style></head><body><header><div style="display:flex;align-items:center;gap:8px"><div class="logo">facet</div><div class="search-box"><i class="fa fa-search"></i><input placeholder="Search Facet"></div></div><div class="nav-center"><div class="nav-icon active" onclick="show('home')"><i class="fa fa-house"></i></div><div class="nav-icon" onclick="show('reels')"><i class="fa fa-tv"></i></div><div class="nav-icon" onclick="show('market')"><i class="fa fa-store"></i></div><div class="nav-icon" onclick="show('pages')"><i class="fa fa-flag"></i></div></div><div><img src="https://i.pravatar.cc/100?img=12" style="width:40px;height:40px;border-radius:50%"></div></header><div class="container"><div class="left"><div class="left-item" onclick="show('home')"><img src="https://i.pravatar.cc/100?img=12" style="width:36px;height:36px;border-radius:50%"><span>Your Profile</span></div><div class="left-item" onclick="show('market')"><i class="fa fa-store"></i><span>Marketplace</span></div><div class="left-item" onclick="show('reels')"><i class="fa fa-tv"></i><span>Watch REAL VIDEO</span></div><div class="left-item" onclick="show('pages')"><i class="fa fa-flag"></i><span>Pages REAL</span></div><div class="left-item" onclick="show('settings')"><i class="fa fa-gear"></i><span>Settings WORKING</span></div></div><div class="feed"><div id="home"><div class="story-bar" id="stories"></div><div class="create-post"><div class="cp-top"><img src="https://i.pravatar.cc/100?img=12"><input id="txt" placeholder="What's on your mind?"></div><div style="display:flex;justify-content:space-around;margin-top:12px;border-top:1px solid #e4e6eb;padding-top:8px"><div onclick="post()" style="cursor:pointer"><i class="fa fa-video" style="color:#f3425f"></i> Live</div><div onclick="document.getElementById('f').click()" style="cursor:pointer"><i class="fa fa-images" style="color:#45bd62"></i> Photo</div><div><i class="fa fa-face-smile" style="color:#f7b928"></i> Feeling</div></div><input type="file" id="f" hidden accept="image/*"></div><div id="posts"></div></div><div id="reels" class="hidden"></div><div id="market" class="hidden"></div><div id="pages" class="hidden"></div><div id="settings" class="hidden"></div></div></div></div><script>
let posts=[{id:1,u:"Ada Lovelace",a:"https://i.pravatar.cc/100?img=5",t:"5h",c:"V2 is LIVE! Real video reels, real pages, real settings 😍",img:"https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=600",l:128,liked:false},{id:2,u:"Mark Essien",a:"https://i.pravatar.cc/100?img=8",t:"8h",c:"Building in Lagos! No Bolt token needed 🚀",img:"https://images.unsplash.com/photo-1522071820081-009f0129c71c?w=600",l:342,liked:false}];
let reels=[{u:"@chef_lagos",d:"Jollof the right way 🔥",v:"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4",lk:"12K"},{u:"@dance_queen",d:"#facet challenge",v:"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4",lk:"45K"},{u:"@travel_ng",d:"Obudu beautiful!",v:"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4",lk:"8K"}];
let market=[{t:"iPhone 14 Pro",p:"₦850,000",lo:"Ikeja",img:"https://images.unsplash.com/photo-1592750475338-74b7b21085ab?w=400"},{t:"Sofa Chair",p:"₦120,000",lo:"Lekki",img:"https://images.unsplash.com/photo-1555041469-a586c61ea9bc?w=400"},{t:"PS5",p:"₦450,000",lo:"Yaba",img:"https://images.unsplash.com/photo-1606813907291-d86efa9b94db?w=400"},{t:"Nike Air",p:"₦45,000",lo:"Surulere",img:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400"}];
let pages=JSON.parse(localStorage.getItem('facet_pages')||'[]');
function renderStories(){let h=`<div class="story" style="background:#fff;display:flex;align-items:center;justify-content:center;flex-direction:column"><i class="fa fa-plus" style="background:#0866ff;color:#fff;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center"></i><span style="margin-top:8px;font-weight:600">Create story</span></div>`;for(let i=1;i<=5;i++)h+=`<div class="story"><img src="https://picsum.photos/200/300?${i}"><span style="position:absolute;bottom:8px;left:8px;color:#fff;font-weight:600">User ${i}</span></div>`;document.getElementById('stories').innerHTML=h;}
function renderPosts(){let h="";posts.forEach(p=>{h+=`<div class="post"><div style="display:flex;justify-content:space-between"><div style="display:flex;gap:8px"><img src="${p.a}" style="width:40px;height:40px;border-radius:50%"><div><div style="font-weight:600">${p.u}</div><div style="font-size:12px;color:#65676b">${p.t}</div></div></div><i class="fa fa-ellipsis"></i></div><div style="margin:12px 0">${p.c}</div>${p.img?`<img class="pi" src="${p.img}">`:''}<div class="ps"><span>👍 ${p.l}</span><span>24 comments</span></div><div class="pb"><div class="btn ${p.liked?'liked':''}" onclick="like(${p.id})"><i class="fa fa-thumbs-up"></i> Like</div><div class="btn"><i class="fa fa-message"></i> Comment</div><div class="btn"><i class="fa fa-share"></i> Share</div></div></div>`});document.getElementById('posts').innerHTML=h;}
function renderReels(){let h='<h2>Reels - REAL VIDEO! Tap to pause</h2>';reels.forEach(r=>{h+=`<div class="reel"><video autoplay loop muted playsinline src="${r.v}" onclick="this.paused?this.play():this.pause()"></video><div class="ra"><div><i class="fa fa-heart" style="font-size:28px"></i><br>${r.lk}</div></div><div class="ov"><div style="font-weight:700">${r.u}</div><div>${r.d}</div></div></div>`});document.getElementById('reels').innerHTML=h;}
function renderMarket(){let h='<h2>Marketplace</h2><div class="market">';market.forEach(m=>{h+=`<div class="mitem"><img src="${m.img}"><div class="minfo"><div style="font-weight:700">${m.p}</div><div>${m.t}</div><div style="color:#65676b;font-size:12px">${m.lo}</div></div></div>`});h+='</div>';document.getElementById('market').innerHTML=h;}
function renderPages(){let h=`<div class="view"><h2>Pages - REAL CREATE!</h2><div class="form"><input id="pgN" placeholder="Page Name"><input id="pgC" placeholder="Category"><textarea id="pgB" placeholder="Bio"></textarea><button class="btn-blue" onclick="createPage()">Create Page</button></div><hr style="margin:16px 0"><h3>Your Pages (${pages.length})</h3>`;if(pages.length==0)h+='<p>No pages</p>';else pages.forEach(p=>{h+=`<div style="padding:12px;border:1px solid #ddd;border-radius:8px;margin:8px 0"><b>${p.name}</b> - ${p.cat}</div>`});h+='</div>';document.getElementById('pages').innerHTML=h;}
function renderSettings(){document.getElementById('settings').innerHTML=`<div class="view"><h2>Settings WORKING!</h2><p><br>Dark Mode <input type="checkbox" onchange="document.body.style.background=this.checked?'#18191a':'#f0f2f5'"></p><br><p>No Bolt token! V2 saves pages with localStorage.</p></div>`;}
function show(t){['home','reels','market','pages','settings'].forEach(id=>document.getElementById(id).classList.add('hidden'));document.getElementById(t).classList.remove('hidden');if(t=='reels')renderReels();if(t=='market')renderMarket();if(t=='pages')renderPages();if(t=='settings')renderSettings();}
function like(id){let p=posts.find(x=>x.id==id);p.liked?(p.l--,p.liked=false):(p.l++,p.liked=true);renderPosts();}
function post(){let txt=document.getElementById('txt').value;if(!txt)return alert('Write something');let f=document.getElementById('f').files[0];let img=f?URL.createObjectURL(f):'';posts.unshift({id:Date.now(),u:"You",a:"https://i.pravatar.cc/100?img=12",t:"Now",c:txt,img:img,l:0,liked:false});document.getElementById('txt').value='';renderPosts();}
function createPage(){let n=document.getElementById('pgN').value;if(!n)return alert('Enter name');pages.push({name:n,cat:document.getElementById('pgC').value});localStorage.setItem('facet_pages',JSON.stringify(pages));alert('Page "'+n+'" created!');renderPages();}
renderStories();renderPosts();
</script></body></html>
